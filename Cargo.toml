[package]
name = "rotazioni"
version = "0.1.0"
edition = "2024"

[lib]
name = "rotazioni"
crate-type = ["cdylib", "staticlib", "rlib"]
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
winit = "0.30.13"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
eframe = { version = "0.36", features = ["glow"] }

[target.'cfg(target_os = "android")'.dependencies]
eframe = { version = "0.36", default-features = false, features = [
    "glow",
    "default_fonts",
    "android-native-activity",
] }
android_logger = "0.15"
log = "0.4"
jni = "0.22"

[package.metadata.android]
package = "it.etinet.rotazionivolley"
apk_name = "rotazioni"
build_targets = [ "armv7-linux-androideabi", "aarch64-linux-android" ]
resources = "res"

[package.metadata.android.sdk]
min_sdk_version = 19
target_sdk_version = 34

[package.metadata.android.application]
label = "Rotazioni Volley"
icon = "@mipmap/ic_launcher"

[package.metadata.android.application.activity]
orientation = "sensorLandscape"

[patch.crates-io]
egui_glow = { path = "vendor/egui_glow" }

[profile.release]
strip = false
